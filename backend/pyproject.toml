[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cust-ppt-automation"
version = "0.1.0"
description = "AI-Powered Service Review PPT Generation System"
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
